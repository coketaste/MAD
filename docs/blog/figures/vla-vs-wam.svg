<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Two ways to turn an observation into an action">
<title>Two ways to turn an observation into an action</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:sans-serif;fill:#1a1a1a} .muted{fill:#555}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#c45911"/></marker></defs>
<text x="16" y="28" font-size="16" font-weight="600">Two ways to turn an observation into an action</text>
<text x="16" y="50" font-size="13" class="muted">FastWAM is the lower path.</text>
<text x="16" y="104" font-size="15" font-weight="600">VLA</text>
<rect x="96" y="76" width="184" height="48" rx="8" fill="#f4f7fb" stroke="#1f4e79" stroke-width="1.5"/>
<text x="188" y="106" font-size="15" text-anchor="middle">observations</text>
<rect x="312" y="76" width="184" height="48" rx="8" fill="#f4f7fb" stroke="#1f4e79" stroke-width="1.5"/>
<text x="404" y="106" font-size="15" text-anchor="middle">action</text>
<line x1="280" y1="100" x2="312" y2="100" stroke="#c45911" stroke-width="2" marker-end="url(#arrow)"/>
<text x="16" y="176" font-size="15" font-weight="600">WAM</text>
<rect x="96" y="148" width="184" height="48" rx="8" fill="#f4f7fb" stroke="#1f4e79" stroke-width="1.5"/>
<text x="188" y="178" font-size="15" text-anchor="middle">observations</text>
<rect x="312" y="148" width="184" height="48" rx="8" fill="#f4f7fb" stroke="#1f4e79" stroke-width="1.5"/>
<text x="404" y="178" font-size="15" text-anchor="middle">predicted scene</text>
<line x1="280" y1="172" x2="312" y2="172" stroke="#c45911" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="528" y="148" width="176" height="48" rx="8" fill="#f4f7fb" stroke="#1f4e79" stroke-width="1.5"/>
<text x="616" y="178" font-size="15" text-anchor="middle">action</text>
<line x1="496" y1="172" x2="528" y2="172" stroke="#c45911" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
