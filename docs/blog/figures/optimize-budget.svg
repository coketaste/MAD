<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="Budget 1. The kernel test is 1.0378 times faster. The model samples do not clear the keep rule.">
<title>Budget 1. The kernel test is 1.0378 times faster. The model samples do not clear the keep rule.</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:sans-serif;fill:#1a1a1a} .muted{fill:#555}</style>
<text x="16" y="28" font-size="16" font-weight="600">Budget 1. The kernel test improved. The model gate did not keep it.</text>

<text x="16" y="64" font-size="15" font-weight="600">Kernel test</text>
