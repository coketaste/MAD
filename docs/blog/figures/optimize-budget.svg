<text x="16" y="198" font-size="13" class="muted">1.0378&#215; on this test.</text>
<text x="16" y="218" font-size="13" class="muted">K=3072 is 1.0476&#215;.</text>
<text x="16" y="238" font-size="13" class="muted">K=4096 is 1.0282&#215;.</text>
<text x="16" y="270" font-size="13" class="muted">The bars differ by 3.7%.</text>
<text x="16" y="290" font-size="13" class="muted">On the right, a dot is one sample</text>
<text x="16" y="310" font-size="13" class="muted">and the orange mark is the median.</text>

